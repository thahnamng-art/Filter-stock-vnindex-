name: Deploy Web App to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Publish Static Web to GitHub Pages
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 1. Checkout source code (Native Git - No Node 20 warning)
        run: |
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout -f FETCH_HEAD

      - name: 2. Install dependencies & Build Web Bundle (Vite)
        run: |
          node -v
          npm -v
          npm install --legacy-peer-deps
          npm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          ls -la dist/

      - name: 3. Publish build output to gh-pages branch
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy Web App to GitHub Pages (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages

      - name: 4. Auto-Configure GitHub Pages & Print Public URL
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          PAGES_URL="https://${OWNER}.github.io/${REPO}/"

          # Thử tự động bật GitHub Pages từ nhánh gh-pages qua GitHub REST API
          HTTP_CODE=$(curl -s -o /tmp/pages_init.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}' || echo "000")

          if [ "$HTTP_CODE" = "409" ]; then
            # Nếu Pages đã tồn tại, cập nhật nhánh nguồn về gh-pages
            curl -s -o /tmp/pages_update.json \
              -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
              -d '{"source":{"branch":"gh-pages","path":"/"}}' || true
          fi

          echo "=========================================================="
          echo "✅ ĐÃ XUẤT BẢN WEB LÊN NHÁNH gh-pages THÀNH CÔNG!"
          echo "🌐 Link truy cập Web: ${PAGES_URL}"
          echo "=========================================================="

          echo "### ✅ Xuất bản Web lên GitHub Pages thành công!" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Đường dẫn Web công khai:** [${PAGES_URL}](${PAGES_URL})" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Nhánh xuất bản:** \`gh-pages\` (đã tự động tạo `index.html`, `404.html`, `.nojekyll`)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> **Lưu ý (nếu mở link lần đầu chưa hiện):** Vào mục **Settings -> Pages** của repository -> tại mục **Build and deployment (Source)** chọn **Deploy from a branch** -> chọn nhánh **\`gh-pages\`** và thư mục **\`/ (root)\`** rồi bấm **Save**." >> "$GITHUB_STEP_SUMMARY"

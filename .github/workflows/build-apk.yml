name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  release:
    types: [created, published]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 1. Checkout repository (Native Git - No Node 20 warning)
        run: |
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout -f FETCH_HEAD

      - name: 2. Configure Pre-installed Java JDK 21 & Node.js
        run: |
          if [ -d "/usr/lib/jvm/temurin-21-jdk-amd64" ]; then
            echo "JAVA_HOME=/usr/lib/jvm/temurin-21-jdk-amd64" >> "$GITHUB_ENV"
            echo "/usr/lib/jvm/temurin-21-jdk-amd64/bin" >> "$GITHUB_PATH"
          fi
          java -version
          node -v
          npm -v

      - name: 3. Accept Android SDK Licenses & Install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" 2>/dev/null || true

      - name: 4. Install NPM Dependencies & Capacitor Android
        run: |
          npm install --legacy-peer-deps
          npm install --no-save --legacy-peer-deps @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: 5. Build Web Assets (Vite)
        run: |
          npm run build

      - name: 6. Initialize Native Android Project & Auto-Increment VersionCode
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          chmod +x android/gradlew

          # Tự động tăng versionCode & versionName theo GITHUB_RUN_NUMBER để Android nhận diện bản mới hơn
          RUN_NUM=${GITHUB_RUN_NUMBER:-1}
          VER_CODE=$((200 + RUN_NUM))
          VER_NAME="1.0.${RUN_NUM}"
          sed -i "s/versionCode 1/versionCode ${VER_CODE}/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${VER_NAME}\"/g" android/app/build.gradle
          echo "✅ Đã cập nhật versionCode=${VER_CODE}, versionName=${VER_NAME}"

      - name: 7. Build APK & Sign with Fixed PKCS#8 Key via apksigner
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..
          mkdir -p release-apks
          find android/app/build/outputs/apk/debug -name "*.apk" -exec cp {} release-apks/fialda-quant-screener-debug.apk \;

          # Ký trực tiếp bằng cặp khóa cố định PKCS#8 (.pk8) + X.509 (.x509.pem) qua apksigner
          # Không phụ thuộc định dạng Java KeyStore, đảm bảo 100% mọi bản build có cùng chữ ký SHA-256!
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" sign \
            --key android-keystore/fialda-signing.pk8 \
            --cert android-keystore/fialda-signing.x509.pem \
            release-apks/fialda-quant-screener-debug.apk

          "$APKSIGNER" verify --print-certs release-apks/fialda-quant-screener-debug.apk
          ls -lh release-apks/

      - name: 8. Publish APK to GitHub Releases via GitHub CLI
        run: |
          TAG_NAME="v1.0.${GITHUB_RUN_NUMBER}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          fi
          gh release create "$TAG_NAME" release-apks/*.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Fialda Quant Screener APK v1.0.${GITHUB_RUN_NUMBER} (Hỗ trợ Update trực tiếp)" \
            --notes "Bản cài đặt Android APK tự động (versionCode $((200 + ${GITHUB_RUN_NUMBER:-1})), ký cố định bằng \`apksigner\` SHA-256 \`84:AB:AC:FF...\`)." \
            --latest || \
          gh release upload "$TAG_NAME" release-apks/*.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber || true

      - name: 9. Build Summary
        run: |
          echo "### ✅ Bản dựng Android APK (Hỗ trợ Update trực tiếp) hoàn tất!" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Phiên bản:** \`v1.0.${GITHUB_RUN_NUMBER}\` (\`versionCode: $((200 + ${GITHUB_RUN_NUMBER:-1}))\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Chữ ký số SHA-256:** \`84:AB:AC:FF:E3:73:84:16:D3:58:9E:A9:81:0C:55:08:36:29:0F:1D:D3:71:AB:62:A7:66:02:51:50:84:F9:BF\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          ls -lh release-apks/ >> "$GITHUB_STEP_SUMMARY"

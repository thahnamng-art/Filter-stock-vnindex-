name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
      - '**'
    tags:
      - 'v*'
  release:
    types: [created, published]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Set up Java JDK 21 (Required by Capacitor 8 & Gradle 8.14)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Accept Android SDK Licenses & Install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" 2>/dev/null || true

      - name: 5. Install NPM Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: 6. Build Web Assets (Vite)
        run: |
          npm run build

      - name: 7. Initialize Clean Native Android Project & Sync Capacitor
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          chmod +x android/gradlew

      - name: 8. Build Debug APK (Cài đặt trực tiếp trên mọi máy Android)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..
          mkdir -p release-apks
          find android/app/build/outputs/apk/debug -name "*.apk" -exec cp {} release-apks/fialda-quant-screener-debug.apk \;
          ls -lh release-apks/

      - name: 9. Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fialda-quant-apk
          path: release-apks/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 10. Auto-Publish APK to GitHub Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: "Fialda Quant Screener APK - Build #${{ github.run_number }}"
          files: release-apks/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 11. Build Summary
        run: |
          echo "### ✅ Bản dựng Android APK hoàn tất thành công!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**File APK đã tạo:**" >> $GITHUB_STEP_SUMMARY
          ls -lh release-apks/ >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "👉 Tải file **fialda-quant-screener-debug.apk** tại mục **Artifacts** bên dưới hoặc trong mục **Releases** của kho lưu trữ GitHub!" >> $GITHUB_STEP_SUMMARY

name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Loại bản dựng APK (both, debug, hoặc release)'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - debug
          - release

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Set up Gradle Action
        uses: gradle/actions/setup-gradle@v3

      - name: 5. Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: 6. Install NPM Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: 7. Build Web Assets (Vite)
        run: |
          npm run build

      - name: 8. Sync Capacitor Android
        run: |
          npx cap sync android

      - name: 9. Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: 10. Build Debug APK (Cài đặt ngay trên điện thoại)
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cd ..
          mkdir -p release-apks
          find android/app/build/outputs/apk/debug -name "*.apk" -exec cp {} release-apks/fialda-quant-screener-debug.apk \;

      - name: 11. Build Release APK (Bản phát hành)
        if: ${{ github.event.inputs.build_type != 'debug' }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon || true
          cd ..
          mkdir -p release-apks
          find android/app/build/outputs/apk/release -name "*.apk" -exec cp {} release-apks/fialda-quant-screener-release.apk \; 2>/dev/null || true

      - name: 12. Upload APK Artifacts (Lưu trữ tải về trực tiếp)
        uses: actions/upload-artifact@v4
        with:
          name: fialda-quant-apk
          path: release-apks/*.apk
          retention-days: 30

      - name: 13. Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 14. Build Summary
        run: |
          echo "### 🚀 Bản dựng Android APK hoàn tất thành công!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Các file APK đã được tạo:**" >> $GITHUB_STEP_SUMMARY
          ls -lh release-apks/ >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tải file APK trực tiếp tại mục **Artifacts** bên trên hoặc tab **Releases** của repository!" >> $GITHUB_STEP_SUMMARY
